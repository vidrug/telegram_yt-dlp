<!--
  Виджет «📋 Все форматы» (Bot API 10.4) в стиле «Инвентарь» из UI-гайда Cyberpunk 2077 (UI Part 2, кадры 6, 7, 48):
  форматы — плитки, видео по три в ряд, звук по два. Полоса слева — «редкость»: у видео по качеству
  (4K золото, 2K фиолетовый, 1080 синий, 720 зелёный, ниже серый), у звука по кодеку (AAC зелёный, Opus фиолетовый).
  Тапом выбирается по одному видео и звуку (повторный снимает), выбранная плитка — заливка 40% и яркий контур.
  Не влезает на экран — секция листается (◀ 1/4 ▶): страницы бот отдаёт в ответах на запросы p:<v|a>:<n>.
  «Скачать» шлёт f:<номер видео>:<номер звука>:<sb>, ход скачивания бот показывает отдельным виджетом.
  Три общих элемента — как на первом экране (bot/widget.html): «Вырезать рекламу» — строка с переключателем,
  «Скачать» — жёлтая главная кнопка, ✕ — квадратная иконка.
  chat_data (см. full_state в bot/widget.py):
    {"s": "full", "c": [видео, звук] — сколько всего, "n": [страниц], "p": [плиток на странице],
     "v": [[id, качество, кодек, МБ, 1 — звук внутри], ...], "a": [[id, звук, язык, МБ], ...], "y": 1}
  Лимит: 4096 байт после zlib -9; комментарии и пробелы бот вырезает перед отправкой.
-->
<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;background:#0e0e17;color:#f75049;font:15px/1.35 system-ui;--r:#f75049;--h:#f75049b2;--l:#f7504961;--c:#5ef6ff;--w:#ece9e6;--y:#f0b537;--a:#fcee0a}
#gw{position:absolute;top:0;left:0;width:100%;height:140px;background:linear-gradient(#f7504933,#f7504900)}
/* строки экрана — position:relative: глитч сдвигает их через left, а плитки внутри числятся за своей строкой */
#app,#app>*{position:relative}
#h{display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:6px;border-bottom:1px solid var(--l)}
#tt{font:500 25px/1.1 system-ui}
#h small,.lab,.sm{letter-spacing:.05em}
#h small{font-size:12px;color:var(--h)}
/* легенда «редкости» */
.lg{display:flex;gap:10px;margin-top:7px;font:600 11px/1 system-ui;color:var(--h)}
.lg span{display:flex;align-items:center;gap:4px}
.lg i{width:3px;height:10px}
/* подпись секции и листалка */
.lab{display:flex;align-items:center;gap:6px;margin:9px 0 5px;font:600 13px/1 system-ui}
.lab span{flex:1}
.lab small{color:var(--h);font-weight:500}
.lab i{font-style:normal}
.pb{width:24px;height:20px;border:1px solid var(--l);color:var(--c);display:flex;align-items:center;justify-content:center}
/* стрелки — треугольники SVG с центром масс в центре квадрата (◀ ▶ шрифта по рамке глифа съезжают к основанию) */
.pb svg{width:9px;height:10px}
.pb svg,.tag svg{fill:currentColor;stroke:currentColor}
.pn{min-width:30px;text-align:center;font-size:12px;color:var(--h)}
/* ячейка: слева скоба или полоса редкости, контур со срезанным углом; у кнопок — ступенька сверху */
.c{position:relative;z-index:0}
.fr,.x svg,.fb,.gs{position:absolute;left:0;top:0;width:100%;height:100%}
.fr{z-index:-1;fill:#f7504914;stroke:var(--l)}
.fr .b{fill:var(--a,var(--r));stroke:none}
.on>.fr{fill:#f7504966;stroke:var(--r)}
.leg>.fr{fill:#f0b5371a}
.g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.g2{grid-template-columns:1fr 1fr}
.t{height:46px;min-width:0;padding:6px 9px 5px 11px;display:flex;flex-direction:column;justify-content:space-between}
.t div{display:flex;align-items:center;justify-content:space-between;gap:4px;white-space:nowrap}
.q{color:var(--w);font:700 13.5px/1 system-ui;letter-spacing:.03em}
.i{min-width:0;color:var(--h);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.k{color:var(--h);font:600 11px/1 system-ui;letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis}
.z{color:var(--c);font:700 13px/1 system-ui}
/* ярлык «звук внутри» — динамик в жёлтой рамке */
.tag{padding:2px 3px;border:1px solid;color:var(--y)}
.tag svg{display:block;width:10px;height:8px}
.sm{margin:9px 0 6px;color:var(--w);font-weight:600;font-size:13px}
/* Переключатель, «Скачать» и ✕ — как на первом экране (bot/widget.html), те же размеры, цвета и состояния.
   Шрифт строки переключателя и пары кнопок — как у тела первого экрана: микротекст наследует ту же разрядку 0.65px */
.sw,#ac{font:600 13px/1 system-ui;letter-spacing:.05em}
/* микротекст: служебные коды и мелкая печать */
.u{font:600 8px/1.25 system-ui;color:var(--l);white-space:nowrap}
.tr,.dl,.x{position:relative}
/* «Вырезать рекламу» — строка без рамки с настоящим переключателем: угловатая дорожка и ползунок */
.sw{display:flex;align-items:center;gap:8px;padding:6px 0;border:solid #f7504933;border-width:1px 0}
.sl{flex:1;color:var(--w)}
.sl .u{display:block;margin-top:4px}
/* дорожка — CSS-рамка, ползунок — flex по центру: как на первом экране */
.tr{width:44px;height:20px;display:flex;align-items:center;padding:0 3px;border:1px solid var(--l)}
.tr i{width:16px;height:12px;background:var(--l)}
.sw.on .tr{justify-content:flex-end;border-color:#1ded83;background:#1ded8329}
.sw.on .tr i{background:#1ded83}
.sw.on>.u{color:#1ded83}
/* «Скачать» и ✕ — пара, как «Смотрите на» и «Трейлер» на cyberpunk.net (13.11): рамка #fcee0a 2 px — залитое
   кольцо (обводка двоилась на масштабе 125 %). У «Скачать» срезан внешний левый верхний угол, у ✕ — внешний
   правый нижний; обращённые друг к другу стороны прямые, у «Скачать» посередине глубокий узкий паз (14×2 px).
   Без выбора «Скачать» тёмная с жёлтой подписью, с выбором — сплошная, подпись чёрная; внизу слева — код запроса.
   При нажатии — глитч (.gg): заливка рвётся на полосы. Пара не шире 420 px, справа */
#ac{display:flex;gap:8px;margin:8px 0 0 auto;max-width:420px}
.dl{flex:1;z-index:0;height:40px;display:flex;align-items:center;justify-content:center;padding-bottom:3px}
.fb,.gs{z-index:-1;fill:var(--a)}
.fb .k{fill:#0e0e1799}
.on .fb .k{fill:var(--a)}
.gs,.gg .fb{display:none}
.gg .gs{display:block}
.dl b{position:relative;color:var(--a);font:700 16px/1 system-ui;letter-spacing:.06em}
.dl.on b,.gg b{color:#0e0e17}
/* ✕ — вторая кнопка пары: красная рамка без паза (цвет интерфейса), тусклая, пока сбрасывать нечего; крест — в центре масс кнопки
   (срез правого нижнего угла сдвигает его на полпикселя влево и вверх) */
.x{width:44px;height:40px}
.x svg{fill:#f7504959;stroke:none}
.x.on svg{fill:var(--r)}
.x .cr{fill:none;stroke:#f7504973;stroke-width:2}
.x.on .cr{stroke:var(--r)}
.m{color:var(--y);font-size:13px;margin-top:5px}
.gz{color:#5ef6ff;--r:#5ef6ff;--l:#5ef6ff;--h:#5ef6ff;--c:#f0b537;--w:#f0b537}
</style>
<div id="gw"></div>
<div id="app"></div>
<script>
const W = window.TelegramWidget, $ = i => document.getElementById(i), app = $('app');
// Выбор: sv / sa — номера видео и звука во всём списке (-1 — нет), SV / SA — их строки:
// итог нужен и когда выбранная плитка на другой странице. P — полученные страницы, pg — открытые
let sv = -1, sa = -1, SV, SA, sb = 0, note = '', busy = 0, Wd = 336, D, P, pg, first = 1;
try { sb = +localStorage.sb || 0 } catch (e) {}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';'), N = s => esc(s).toUpperCase();
const say = t => { note = t; draw() };
// Данные — разбором JS, а не JSON.parse: в Telegram Desktop JSON.parse читает числа с русской запятой,
// [7,1] становится [7.1, 1], а 1.4 — 1. Бот присылает чистый JSON, он же — литерал JS
const J = s => { try { return eval('(' + s + ')') || {} } catch (e) { return {} } };
const load = () => { D = J(W.chatData); P = { v: [D.v], a: [D.a] }; pg = { v: 0, a: 0 } };
const K = t => t == 'v' ? 0 : 1;

// Запрос к боту — строго синхронно в обработчике тапа (правило песочницы); ok — что сделать с ответом.
// busy — строка запроса в пути: пока идёт «Скачать» (f:…), кнопка тёмная и пишет «ЗАПРОС…», как на первом экране
function ask(d, ok) {
  if (busy) return;
  let p;
  try { p = W.request(d) } catch (e) { return say(e.message) }
  busy = d; say('⏳');
  p.then(a => { const r = J(a.result); note = r.e || ''; r.e || !ok || ok(r) },
    e => { note = e.code == 'RATE_LIMITED' ? 'Подожди секунду' : e.code })
    .finally(() => { busy = 0; draw() });
}

// Листание секции t на d страниц; полученные страницы не запрашиваются повторно
function flip(t, d) {
  const n = pg[t] + d;
  if (n < 0 || n >= D.n[K(t)]) return;
  if (P[t][n]) { pg[t] = n; return draw() }
  ask('p:' + t + ':' + n, r => { P[t][n] = r.r; pg[t] = n });
}
const row = (t, g) => P[t][pg[t]][g - pg[t] * D.p[K(t)]];
// Тап по видео: повторный снимает выбор; видео со звуком внутри снимает отдельный звук.
// Звук к такому видео не выбирается — итог и так пишет «со звуком»
function tv(g) { SV = row('v', g); sv = sv == g ? -1 : g; if (sv >= 0 && SV[4]) sa = -1; draw() }
function ta(g) { if (sv < 0 || !SV[4]) { SA = row('a', g); sa = sa == g ? -1 : g } draw() }
function clr() { sv = sa = -1; draw() }
function tsb() { sb = 1 - sb; try { localStorage.sb = sb } catch (e) {} draw() }
// запрос «Скачать»: f:<номер видео>:<номер звука>:<sb>; ничего не выбрано — запроса нет (код — микротекстом на кнопке)
const RQ = () => (sv >= 0 || sa >= 0) && 'f:' + (sv < 0 ? '' : sv) + ':' + (sa < 0 ? '' : sa) + ':' + sb;
function dl() { const q = RQ(); q && (ask(q), GB()) }
// внутренний контур рамки «Скачать» (на 2 px внутрь, против часовой); полосы глитча
const IN = w => `M10.8 2L2 10.8V38H${w - 2}V23H${w - 16}V17H${w - 2}V2Z`,
  GS = w => `<svg class="gs" viewBox="0 0 ${w} 40" preserveAspectRatio="none"><path d="M-6 0h${w}v10H-6zM4 20h${w}v10H4z"/>`
    + `<path fill="#5ef6ff" d="M8 10h${w}v10H8zM-9 30h${w}v10H-9z"/></svg>`;

const MB = x => !x ? '?' : x >= 1024 ? (x / 1024).toFixed(1) + 'G' : (x < 10 ? +x.toFixed(1) : Math.round(x)) + 'M';
// Рамка плитки — inline-SVG в точных пикселях, как FR() в панели (clip-path в песочнице запрещён):
// слева сплошная полоса редкости (цвет — переменная --a плитки), контур со срезанным нижним правым углом
const FR = (w, h) => '<svg class="fr" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none"><path class="b" d="M0 1h4v' + (h - 2)
  + 'h-4z"/><path d="M7.5 1.5H' + (w - 1.5) + 'V' + (h - 8.5) + 'l-7 7H7.5z"/></svg>';
const CL = (x, w, h, c, f, s) => `<div class="c ${c}" data-k="${f}"${s}>${FR(w, h)}${x}</div>`;
// «Редкость»: видео — по качеству, звук — по кодеку
// RC — цвета «редкости» по порогам качества (4K, 2K, 1080, 720, ниже); те же — в легенде
const RC = ['#f0b537', '#9d2bf5', '#2f7fff', '#1ded83', '#6c6876'], RV = q => RC[[2160, 1440, 1080, 720, 0].findIndex(h => (parseInt(q) || 0) >= h)];
const RA = n => RC[/^AAC/.test(n) ? 3 : /^Opus/.test(n) ? 1 : 4];

// Секция: подпись с листалкой и плитки открытой страницы
function sec(t, name) {
  const k = K(t), n = D.n[k], v = t == 'v', w = v ? (Wd - 8) / 3 : (Wd - 4) / 2;
  if (!D.c[k]) return '';
  return `<div class="lab"><span>${name} <small>${D.c[k]}</small></span>`
    + (n > 1 ? `<i class="pb" data-k="${t}-"><svg viewBox="0 0 9 10"><path d="M0.5 5L6.5 1V9Z"/></svg></i><i class="pn">${pg[t] + 1}/${n}</i>`
      + `<i class="pb" data-k="${t}+"><svg viewBox="0 0 9 10"><path d="M8.5 5L2.5 1V9Z"/></svg></i>` : '')
    + `</div><div class="g${v ? '' : ' g2'}">` + P[t][pg[t]].map((x, i) => {
      // ID длиннее 8 знаков (dash-1461665382806657v у Instagram) распирает сетку и руками его не набрать — не показываем
      const g = pg[t] * D.p[k] + i, on = (v ? sv : sa) == g;
      return CL(`<div><span class="q">${N(x[1])}</span>${x[4] ? '<span class="tag"><svg viewBox="0 0 10 8"><path d="M0 2.5H2L5 0V8L2 5.5H0Z"/><path d="M6.5 2.5L7.5 4L6.5 5.5M8 1L9.5 4L8 7" fill="none"/></svg></span>' : x[0].length < 9 ? `<span class="i">${esc(x[0])}</span>` : ''}</div>`
        + `<div><span class="k">${N(x[2])}</span><span class="z">${MB(x[3])}</span></div>`,
        w, 46, 't' + (on ? ' on' : v && parseInt(x[1]) >= 2160 ? ' leg' : ''), t + g, ` style="--a:${v ? RV(x[1]) : RA(x[1])}"`);
    }).join('') + '</div>';
}

// Появление с глитчем, как переход вкладок в /panel: пять кадров по 40 мс.
// Сдвиг — left, не transform: строку, которой скрипт три кадра подряд меняет transform, Telegram Desktop
// делает слоем, и тап по плитке внутри такого слоя достаётся самой строке без data-k
function GZ() {
  let n = 5, r = Math.random;
  const f = () => {
    for (let d = app.firstChild; d; d = d.nextSibling) {
      d.style.visibility = n && r() * 6 < n ? 'hidden' : '';
      d.style.left = n && r() < .5 ? (r() * 40 - 20 | 0) + 'px' : '';
      d.classList.toggle('gz', !!n && r() < .5);
    }
    n-- || clearInterval(t);
  }, t = setInterval(f, 40);
  f();
}

// «Скачать» — глитч при нажатии, как у кнопок на cyberpunk.net: шесть кадров по 40 мс через кадр показывают
// заливку, порванную на сдвинутые жёлтые и циановые полосы (.gg), а кнопка дёргается вбок.
// Сдвиг — left, не transform: Telegram Desktop сделал бы кнопку слоем, и тапы шли бы мимо
function GB() {
  let n = 6;
  const f = () => { const e = $('dl'); e && (e.classList.toggle('gg', n % 2 > 0), e.style.left = n ? (Math.random() * 12 - 6 | 0) + 'px' : ''); n-- || clearInterval(i) }, i = setInterval(f, 40);
  f();
}

function draw() {
  Wd = app.offsetWidth || Wd;
  let h = `<div id="h"><span id="tt">ВСЕ ФОРМАТЫ</span><small>${D.c ? D.c.join(' · ') : ''}</small></div>`;
  // сессия истекла — бот присылает только текст
  if (D.s != 'full') return app.innerHTML = h + `<div class="sm">${esc(D.t)}</div>`;
  // итог: что выбрано и сколько весит, если размеры известны
  const mx = sv >= 0 && SV[4], a = sa >= 0 && !mx && SA;
  const t = [sv >= 0 && SV[1] + ' ' + SV[2] + (mx ? ' со звуком' : a ? '' : ' без звука'), a && a[1]].filter(Boolean).join(' + ');
  const z = (sv < 0 || SV[3]) && (!a || a[3]) ? MB((sv >= 0 ? SV[3] : 0) + (a ? a[3] : 0)) : '';
  if (D.c[0]) h += '<div class="lg">' + ['4K', '2K', '1080', '720', 'SD']
    .map((x, i) => `<span><i style="background:${RC[i]}"></i>${x}</span>`).join('') + '</div>';
  h += sec('v', 'ВИДЕО') + sec('a', 'ЗВУК') + `<div class="sm">${t ? N(t) : 'ВЫБЕРИ ВИДЕО И ЗВУК'}</div>`;
  // «Вырезать рекламу», «Скачать» и ✕ — та же разметка, что на первом экране (bot/widget.html)
  if (D.y) h += `<div class="sw${sb ? ' on' : ''}" data-k="s"><div class="sl">ВЫРЕЗАТЬ РЕКЛАМУ<i class="u">SPONSORBLOCK · СЕГМЕНТЫ</i></div>`
    + `<i class="u">${sb ? 'ВКЛ' : 'ВЫКЛ'}</i><div class="tr"><i></i></div></div>`;
  // w — ширина рамки «Скачать»: пара кнопок не шире 420 px, минус ✕ и зазор; q — «Скачать» ждёт ответа бота
  const w = Math.min(Wd, 420) - 52, q = busy[0] == 'f';
  app.innerHTML = h + `<div id="ac"><div class="dl${t && !q ? ' on' : ''}" data-k="g" id="dl">`
    // рамка: кольцо = внешний контур по часовой и внутренний против (дырка при любом правиле заливки) + тёмная середина; срезан левый верхний угол, справа паз
    + `<svg class="fb" viewBox="0 0 ${w} 40" preserveAspectRatio="none"><path d="M10 0H${w}V19H${w - 14}V21H${w}V40H0V10Z${IN(w)}"/><path class="k" d="${IN(w)}"/></svg>${GS(w)}<b>${q ? 'ЗАПРОС…' : 'СКАЧАТЬ' + (t && z ? ' · ' + z : '')}</b></div>`
    + `<div class="x${t ? ' on' : ''}" data-k="c"><svg viewBox="0 0 44 40"><path d="M0 0H44V32L36 40H0ZM2 2V38H35.2L42 31.2V2Z"/>`
    + '<path class="cr" d="M16.5 14.5L26.5 24.5M26.5 14.5L16.5 24.5"/></svg></div></div>' + (note ? `<div class="m">${esc(note)}</div>` : '');
  if (first) { first = 0; GZ() }
}

// Тапы — один обработчик на документ, как в /panel: атрибуты onclick Telegram Desktop не вызывает.
// data-k: v12 / a3 — плитка по номеру во всём списке, v+ / v- — листание, s, g, c — кнопки
document.addEventListener('click', e => {
  let t = e.target, k;
  while (t && !(k = t.getAttribute && t.getAttribute('data-k'))) t = t.parentNode;
  if (!k) return;
  const a = k.slice(1);
  a == '+' || a == '-' ? flip(k[0], a == '+' ? 1 : -1) : ({ v: tv, a: ta, s: tsb, g: dl, c: clr })[k[0]](+a);
});
W.onEvent('chatDataChanged', () => { note = ''; load(); draw() });
load();
draw();
W.ready();
</script>
