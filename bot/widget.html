<!--
  Виджет выбора формата и прогресса скачивания (Bot API 10.4).
  HTML отправленного виджета изменить нельзя, поэтому он — тонкий рендерер:
  все тексты, статусы и кнопки присылает бот в chat_data (см. bot/widget.py).
  Лимит: 4096 байт после zlib -9.
-->
<style>
body{margin:0;padding:10px 12px}
table{width:100%;border-collapse:collapse;font-size:.9em;margin:0}
th,td{padding:6px 4px;text-align:center}
th{color:var(--tg-theme-hint-color);font-weight:500}
td.q{text-align:left;font-weight:600}
td.c{border-radius:8px}
.on{background:var(--tg-theme-button-color);color:var(--tg-theme-button-text-color)}
.h{color:var(--tg-theme-hint-color);font-size:.85em;margin:10px 0 6px}
.ch{display:inline-block;padding:5px 10px;margin:0 6px 6px 0;border-radius:14px;background:var(--tg-theme-secondary-bg-color)}
.ch.on{background:var(--tg-theme-button-color)}
.ch.off{color:var(--tg-theme-hint-color)}
.q{font-weight:600}
.m,.n{color:var(--tg-theme-hint-color);font-size:.85em}
.e{color:var(--tg-theme-destructive-text-color)}
.ok{color:var(--tg-theme-accent-text-color)}
.s{display:flex;justify-content:space-between;align-items:center;padding:6px 2px}
.w{flex:none;width:42px;height:24px;border-radius:12px;background:var(--tg-theme-hint-color);position:relative;transition:background .2s}
.w:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.w.on{background:var(--tg-theme-button-color)}
.w.on:after{transform:translateX(18px)}
.b{height:8px;border-radius:4px;margin:10px 0 6px;background:var(--tg-theme-secondary-bg-color);overflow:hidden}
.b i{display:block;height:100%;border-radius:4px;background:var(--tg-theme-button-color);transition:width 2.8s linear}
.b.x i{width:35%;animation:x 1.3s ease-in-out infinite}
@keyframes x{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.a{display:flex;gap:8px;margin-top:10px}
.a button{flex:1}
</style>
<div id="app"></div>
<script>
const W = window.TelegramWidget, app = document.getElementById('app');
let sb = 0, note = '', busy = 0, vs = null, au = null, seen = '';
try { sb = +localStorage.sb || 0 } catch (e) {}

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const mb = x => !x ? '?' : x >= 1000 ? (x / 1024).toFixed(1) + 'G' : x >= 10 ? Math.round(x) + 'M' : x.toFixed(1) + 'M';

function state() {
  try { return JSON.parse(W.chatData) || {} } catch (e) { return {} }
}

// Запрос к боту — строго синхронно в обработчике тапа (правило песочницы)
function ask(data) {
  if (busy) return;
  let p;
  try { p = W.request(data) } catch (e) { note = 'Ошибка: ' + e.message; return draw() }
  busy = 1; note = '⏳'; draw();
  p.then(a => {
    let r = {};
    try { r = JSON.parse(a.result || '{}') } catch (e) {}
    note = r.e || '';
  }, e => {
    note = e.code == 'RATE_LIMITED' ? 'Слишком часто — подожди пару секунд' : 'Не получилось: ' + e.code;
  }).finally(() => { busy = 0; draw() });
}

// Данные кнопок берём из состояния по индексу, а не вписываем в атрибут onclick
function act(i) { ask(state().b[i][1]) }

function toggleSb() {
  sb = sb ? 0 : 1;
  try { localStorage.sb = sb } catch (e) {}
  draw();
}

// Выбор видеодорожки (ячейка таблицы) и звука; повторный тап снимает выбор
function pv(i) {
  vs = vs === i ? null : i;
  if (vs != null && state().v[vs][3]) au = null;  // 🔊 — звук уже внутри
  draw();
}
function pa(i) {
  const s = state();
  if (vs != null && s.v[vs][3]) return;
  au = au === i ? null : i;
  draw();
}
function go() { ask('g:' + (vs ?? '') + ':' + (au ?? '') + ':' + sb) }

function table(s) {
  const V = s.v || [], A = s.a || [], at = {};
  V.forEach((x, i) => at[x[0] + ',' + x[1]] = i);
  const muxed = vs != null && V[vs][3];
  let h = '';
  if (V.length) {
    h += '<table><tr><th></th>' + s.c.map(c => `<th>${esc(c)}</th>`).join('') + '</tr>';
    s.r.forEach((r, ri) => {
      h += `<tr><td class="q">${esc(r)}</td>` + s.c.map((c, ci) => {
        const i = at[ri + ',' + ci];
        if (i == null) return '<td class="n">—</td>';
        return `<td class="c${i === vs ? ' on' : ''}" onclick="pv(${i})">${mb(V[i][2])}${V[i][3] ? '🔊' : ''}</td>`;
      }).join('') + '</tr>';
    });
    h += '</table>';
  }
  if (A.length) {
    h += '<div class="h">Звук</div>' + A.map((a, i) =>
      `<span class="ch${i === au ? ' on' : ''}${muxed ? ' off' : ''}" onclick="pa(${i})">${esc(a[0])} · ${mb(a[1])}</span>`
    ).join('');
  }
  const parts = [];
  let size = 0;
  if (vs != null) { const x = V[vs]; parts.push(s.r[x[0]] + ' ' + s.c[x[1]] + (x[3] ? ' со звуком' : au == null ? ' без звука' : '')); size += x[2] }
  if (au != null && !muxed) { parts.push(A[au][0]); size += A[au][1] }
  const what = (vs == null ? 'Только звук: ' : '') + parts.join(' + ');
  h += `<div class="n" style="margin-top:4px">${parts.length ? esc(what) + (size ? ' ≈ ' + mb(size) : '') : 'Выбери видео и/или звук'}</div>`;
  if (s.y) {
    h += `<div class="s" onclick="toggleSb()"><span>✂️ Вырезать рекламу (SponsorBlock)</span><span class="w${sb ? ' on' : ''}"></span></div>`;
  }
  h += `<div class="a"><button onclick="go()"${parts.length ? '' : ' disabled'}>⬇️ Скачать</button></div>`;
  return h;
}

function job(s) {
  let h = '';
  if (s.l) h += `<div class="q">${esc(s.l)}</div>`;
  if (s.t) h += `<div class="${s.k || 'n'}">${esc(s.t)}</div>`;
  if (s.p != null) {
    const ind = s.p < 0;
    h += `<div class="b${ind ? ' x' : ''}"><i style="width:${ind ? 35 : Math.min(100, s.p)}%"></i></div>`;
  }
  if (s.d) h += `<div class="n">${esc(s.d)}</div>`;
  if (s.b && s.b.length) {
    h += '<div class="a">' + s.b.map((b, i) =>
      `<button onclick="act(${i})">${esc(b[0])}</button>`
    ).join('') + '</div>';
  }
  return h;
}

function draw() {
  const s = state();
  // новая таблица от бота — выбор по умолчанию (лучшее H.264 + AAC) из неё
  if (s.s == 'tbl' && W.chatData != seen) { seen = W.chatData; vs = s.dv ?? null; au = s.da ?? null }
  let h = s.s == 'job' ? job(s) : table(s);
  if (note) h += `<div class="n${note == '⏳' ? '' : ' e'}" style="margin-top:6px">${esc(note)}</div>`;
  app.innerHTML = h;
}

W.onEvent('chatDataChanged', () => { note = ''; draw() });
draw();
W.ready();
</script>
