<!--
  Виджет выбора формата и прогресса скачивания (Bot API 10.4).
  HTML отправленного виджета изменить нельзя, поэтому он — тонкий рендерер:
  все тексты, статусы и кнопки присылает бот в chat_data (см. bot/widget.py).
  Лимит: 4096 байт после zlib -9.
-->
<style>
body{margin:0;padding:10px 12px}
.t{display:flex;gap:6px;margin-bottom:8px}
.t button{flex:1;padding:6px}
.t button:not(.on){background:var(--tg-theme-secondary-bg-color);color:var(--tg-theme-text-color)}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;margin-bottom:6px;border-radius:12px;background:var(--tg-theme-secondary-bg-color)}
.r:active{background:var(--tg-theme-section-separator-color)}
.q{font-weight:600}
.m,.n{color:var(--tg-theme-hint-color);font-size:.85em}
.e{color:var(--tg-theme-destructive-text-color)}
.ok{color:var(--tg-theme-accent-text-color)}
.s{display:flex;justify-content:space-between;align-items:center;padding:6px 2px}
.w{flex:none;width:42px;height:24px;border-radius:12px;background:var(--tg-theme-hint-color);position:relative;transition:background .2s}
.w:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.w.on{background:var(--tg-theme-button-color)}
.w.on:after{transform:translateX(18px)}
/* полоска в духе codepen.io/evawythien/pen/jegRxN: утопленная дорожка, блик, бегущие полосы */
.b{height:14px;padding:3px;margin:10px 0 6px;border-radius:10px;overflow:hidden;background:rgba(0,0,0,.07);box-shadow:inset 0 1px 2px rgba(0,0,0,.14)}
@media (prefers-color-scheme:dark){.b{background:rgba(0,0,0,.25);box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 1px rgba(255,255,255,.08)}}
.b i{display:block;height:100%;min-width:14px;border-radius:7px;background-color:#ef476f;background-image:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.05)),linear-gradient(45deg,rgba(255,255,255,.2) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.2) 50%,rgba(255,255,255,.2) 75%,transparent 75%,transparent);background-size:100% 100%,20px 20px;animation:st .8s linear infinite;transition:width 2.8s linear,background-color 2.8s linear}
@keyframes st{from{background-position:0 0,0 0}to{background-position:0 0,20px 0}}
/* этапы без процента — переливающаяся радуга (период градиента = ширина полоски) */
.b.x i{background-image:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,.05)),linear-gradient(90deg,#4cd964,#5ac8fa,#007aff,#7dc8e8,#5856d6,#ff2d55,#4cd964,#5ac8fa,#007aff,#7dc8e8,#5856d6,#ff2d55,#4cd964);background-size:100% 100%,200% 100%;animation:rb 2.5s linear infinite}
@keyframes rb{from{background-position:0 0,0 0}to{background-position:0 0,100% 0}}
.a{display:flex;gap:8px;margin-top:10px}
.a button{flex:1}
</style>
<div id="app"></div>
<script>
const W = window.TelegramWidget, app = document.getElementById('app');
let tab = 'v', sb = 0, note = '', busy = 0;
try { sb = +localStorage.sb || 0 } catch (e) {}

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
// смесь двух цветов #rrggbb в пропорции t (0..1)
const mix = (a, b, t) => '#' + [1, 3, 5].map(i => Math.round(
  parseInt(a.slice(i, i + 2), 16) * (1 - t) + parseInt(b.slice(i, i + 2), 16) * t
).toString(16).padStart(2, '0')).join('');

function state() {
  try { return JSON.parse(W.chatData) || {} } catch (e) { return {} }
}

// Запрос к боту — строго синхронно в обработчике тапа (правило песочницы)
function ask(data) {
  if (busy) return;
  let p;
  try { p = W.request(data) } catch (e) { note = 'Ошибка: ' + e.message; return draw() }
  busy = 1; note = '⏳'; draw();
  p.then(a => {
    let r = {};
    try { r = JSON.parse(a.result || '{}') } catch (e) {}
    note = r.e || '';
  }, e => {
    note = e.code == 'RATE_LIMITED' ? 'Слишком часто — подожди пару секунд' : 'Не получилось: ' + e.code;
  }).finally(() => { busy = 0; draw() });
}

// Данные кнопок берём из состояния по индексу, а не вписываем в атрибут onclick
function act(i) { ask(state().b[i][1]) }
function choose(key) { ask('d:' + key + ':' + sb) }
function setTab(t) { tab = t; draw() }

function toggleSb() {
  sb = sb ? 0 : 1;
  try { localStorage.sb = sb } catch (e) {}
  draw();
}

function pick(s) {
  const L = { v: s.v || [], a: s.a || [] };
  const other = tab == 'v' ? 'a' : 'v';
  if (!L[tab].length && L[other].length) tab = other;
  let h = '';
  if (L.v.length && L.a.length) {
    h += '<div class="t">' + ['v', 'a'].map(t =>
      `<button class="${t == tab ? 'on' : ''}" onclick="setTab('${t}')">${t == 'v' ? '🎬 Видео' : '🎵 Аудио'} ${L[t].length}</button>`
    ).join('') + '</div>';
  }
  h += L[tab].map((o, i) =>
    `<div class="r" onclick="choose('${tab}${i}')"><span class="q">${esc(o[0])}</span><span class="m">${esc(o[1])}</span></div>`
  ).join('');
  if (s.y) {
    h += `<div class="s" onclick="toggleSb()"><span>✂️ Вырезать рекламу (SponsorBlock)</span><span class="w${sb ? ' on' : ''}"></span></div>`;
  }
  return h;
}

function job(s) {
  let h = '';
  if (s.l) h += `<div class="q">${esc(s.l)}</div>`;
  if (s.t) h += `<div class="${s.k || 'n'}">${esc(s.t)}</div>`;
  if (s.p != null) {
    const ind = s.p < 0, p = ind ? 100 : Math.min(100, s.p);
    // видео — розовая, звук — оранжевая; по мере заполнения из светлой становится насыщенной
    const c = s.w == 'a' ? mix('#fdd38a', '#fca311', p / 100) : mix('#f9bcca', '#ef476f', p / 100);
    h += `<div class="b${ind ? ' x' : ''}"><i style="width:${p}%;background-color:${c}"></i></div>`;
  }
  if (s.d) h += `<div class="n">${esc(s.d)}</div>`;
  if (s.b && s.b.length) {
    h += '<div class="a">' + s.b.map((b, i) =>
      `<button onclick="act(${i})">${esc(b[0])}</button>`
    ).join('') + '</div>';
  }
  return h;
}

function draw() {
  const s = state();
  let h = s.s == 'job' ? job(s) : pick(s);
  if (note) h += `<div class="n${note == '⏳' ? '' : ' e'}" style="margin-top:6px">${esc(note)}</div>`;
  app.innerHTML = h;
}

W.onEvent('chatDataChanged', () => { note = ''; draw() });
draw();
W.ready();
</script>
