<!--
  Виджет выбора формата и прогресса скачивания (Bot API 10.4).
  HTML отправленного виджета изменить нельзя, поэтому он — тонкий рендерер:
  все тексты, статусы и кнопки присылает бот в chat_data (см. bot/widget.py).
  Лимит: 4096 байт после zlib -9.
-->
<style>
body{margin:0;padding:10px 12px}
.t{display:flex;gap:6px;margin-bottom:8px}
.t button{flex:1;padding:6px}
.t button:not(.on){background:var(--tg-theme-secondary-bg-color);color:var(--tg-theme-text-color)}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;margin-bottom:6px;border-radius:12px;background:var(--tg-theme-secondary-bg-color)}
.r:active{background:var(--tg-theme-section-separator-color)}
.q{font-weight:600}
.m,.n{color:var(--tg-theme-hint-color);font-size:.85em}
.e{color:var(--tg-theme-destructive-text-color)}
.ok{color:var(--tg-theme-accent-text-color)}
.s{display:flex;justify-content:space-between;align-items:center;padding:6px 2px}
.w{flex:none;width:42px;height:24px;border-radius:12px;background:var(--tg-theme-hint-color);position:relative;transition:background .2s}
.w:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.w.on{background:var(--tg-theme-button-color)}
.w.on:after{transform:translateX(18px)}
/* прогресс в стиле Cyberpunk 2077 (codepen.io/stevenlei/pen/ZEpyBod): красная полоса со срезанным
   углом и жёсткой голубой тенью, глитч — дёргающиеся срезы и мигание. clip-path и text-shadow
   песочница вырезает, background-position не анимирует — всё движение только transform + steps() */
.b{position:relative;height:12px;padding:3px;margin:10px 0 6px;background:#12121c;border:1px solid rgba(0,230,246,.45);overflow:hidden}
#jf{position:relative;width:0;height:100%;min-width:12px;background:linear-gradient(-45deg,rgba(255,1,60,0) 6px,#ff013c 6px);box-shadow:3px 0 0 #00e6f6;transition:width 2.8s linear;animation:fl 3.2s steps(1,end) infinite}
/* этапы без процента — бегущая жёлто-чёрная лента (градиент с явными точками, см. HAZARD) */
.rw{position:absolute;top:3px;left:3px;width:calc(100% - 6px);height:calc(100% - 6px);overflow:hidden;animation:fl 3.2s steps(1,end) infinite}
.hz{position:absolute;top:0;left:-28px;width:calc(100% + 28px);height:100%;animation:hz .9s linear infinite}
@keyframes hz{from{transform:translateX(0)}to{transform:translateX(28px)}}
/* исчезание: полоса схлопывается и прыгает в сторону */
@keyframes fl{0%{transform:none}89%{transform:scaleY(0)}90%{transform:translateX(5px)}93%{transform:scaleY(0)}95%{transform:translateX(-4px)}97%{transform:none}}
/* глитч-срезы: в покое спрятаны слева за краем дорожки */
.g1,.g2{position:absolute;left:0;width:100%;transform:translateX(-200%)}
.g1{top:1px;height:3px;background:#00e6f6;animation:g1 3.2s steps(1,end) infinite}
.g2{bottom:1px;height:2px;background:#f8f005;animation:g2 3.2s steps(1,end) infinite}
@keyframes g1{0%{transform:translateX(-200%)}87%{transform:translateX(8px)}91%{transform:translateX(-6px)}94%{transform:translateX(-200%)}}
@keyframes g2{0%{transform:translateX(-200%)}90%{transform:translateX(-9px)}92%{transform:translateX(6px)}96%{transform:translateX(-200%)}}
/* текст статуса двоится голубым и красным в такт глитчу (копии из data-t) */
.gt{position:relative}
.gt:before,.gt:after{content:attr(data-t);position:absolute;top:0;left:0;white-space:nowrap;transform:translateX(-200vw)}
.gt:before{color:#00e6f6;animation:t1 3.2s steps(1,end) infinite}
.gt:after{color:#ff013c;animation:t2 3.2s steps(1,end) infinite}
@keyframes t1{0%{transform:translateX(-200vw)}88%{transform:translate(-3px,-1px)}91%{transform:translate(2px,1px)}94%{transform:translateX(-200vw)}}
@keyframes t2{0%{transform:translateX(-200vw)}89%{transform:translate(3px,1px)}93%{transform:translate(-2px,0)}95%{transform:translateX(-200vw)}}
.a{display:flex;gap:8px;margin-top:10px}
.a button{flex:1}
</style>
<div id="app"></div>
<script>
const W = window.TelegramWidget, app = document.getElementById('app');
let tab = 'v', sb = 0, note = '', busy = 0;
try { sb = +localStorage.sb || 0 } catch (e) {}

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');

function state() {
  try { return JSON.parse(W.chatData) || {} } catch (e) { return {} }
}

// Запрос к боту — строго синхронно в обработчике тапа (правило песочницы)
function ask(data) {
  if (busy) return;
  let p;
  try { p = W.request(data) } catch (e) { note = 'Ошибка: ' + e.message; return draw() }
  busy = 1; note = '⏳'; draw();
  p.then(a => {
    let r = {};
    try { r = JSON.parse(a.result || '{}') } catch (e) {}
    note = r.e || '';
  }, e => {
    note = e.code == 'RATE_LIMITED' ? 'Слишком часто — подожди пару секунд' : 'Не получилось: ' + e.code;
  }).finally(() => { busy = 0; draw() });
}

// Данные кнопок берём из состояния по индексу, а не вписываем в атрибут onclick
function act(i) { ask(state().b[i][1]) }
function choose(key) { ask('d:' + key + ':' + sb) }
function setTab(t) { tab = t; draw() }

function toggleSb() {
  sb = sb ? 0 : 1;
  try { localStorage.sb = sb } catch (e) {}
  draw();
}

function pick(s) {
  const L = { v: s.v || [], a: s.a || [] };
  const other = tab == 'v' ? 'a' : 'v';
  if (!L[tab].length && L[other].length) tab = other;
  let h = '';
  if (L.v.length && L.a.length) {
    h += '<div class="t">' + ['v', 'a'].map(t =>
      `<button class="${t == tab ? 'on' : ''}" onclick="setTab('${t}')">${t == 'v' ? '🎬 Видео' : '🎵 Аудио'} ${L[t].length}</button>`
    ).join('') + '</div>';
  }
  h += L[tab].map((o, i) =>
    `<div class="r" onclick="choose('${tab}${i}')"><span class="q">${esc(o[0])}</span><span class="m">${esc(o[1])}</span></div>`
  ).join('');
  if (s.y) {
    h += `<div class="s" onclick="toggleSb()"><span>✂️ Вырезать рекламу (SponsorBlock)</span><span class="w${sb ? ' on' : ''}"></span></div>`;
  }
  return h;
}

// Лента опасности одним градиентом с явными точками (плитку движок не повторяет): период вдоль
// линии 45° — 28/√2 px, то есть 28 px по горизонтали, ровно на столько её сдвигает анимация hz
const HAZARD = (() => {
  const P = 28 / Math.SQRT2, a = '#f8f005', z = '#12121c', g = [];
  for (let i = 0; i < 48; i++) {
    const x = (i * P).toFixed(1), y = (i * P + P / 2).toFixed(1), e = ((i + 1) * P).toFixed(1);
    g.push(`${a} ${x}px`, `${a} ${y}px`, `${z} ${y}px`, `${z} ${e}px`);
  }
  return `linear-gradient(45deg,${g.join(',')})`;
})();
const $ = id => document.getElementById(id);
const show = (id, on, how) => { $(id).style.display = on ? (how || 'block') : 'none' };
let mode = '', lastB = null;

// Ход скачивания: разметка создаётся один раз, дальше меняются только тексты,
// ширина и цвет — так ширина плавно доезжает (transition), а полосы не перезапускаются
function job(s) {
  if (mode != 'job') {
    mode = 'job'; lastB = null;
    app.innerHTML = '<div class="q" id="jl"></div><div id="jt"></div>'
      + '<div class="b" id="jb"><div class="rw" id="jr"><span class="hz" id="jh"></span></div>'
      + '<div id="jf"><span class="g1"></span><span class="g2"></span></div></div>'
      + '<div class="n" id="jd"></div><div class="a" id="ja"></div><div id="jn" style="margin-top:6px"></div>';
    $('jh').style.backgroundImage = HAZARD;
  }
  $('jl').textContent = s.l || '';
  $('jt').className = (s.k || 'n') + ' gt';
  $('jt').textContent = s.t || '';
  $('jt').setAttribute('data-t', s.t || '');  // копии текста для глитча
  show('jb', s.p != null);
  if (s.p != null) {
    const ind = s.p < 0;
    show('jr', ind);
    show('jf', !ind);
    if (!ind) {
      $('jf').style.width = Math.min(100, s.p) + '%';
    }
  }
  $('jd').textContent = s.d || '';
  const b = JSON.stringify(s.b || []);
  if (b != lastB) {  // кнопки пересоздаём только при изменении — не сбивать нажатие
    lastB = b;
    $('ja').innerHTML = (s.b || []).map((x, i) => `<button onclick="act(${i})">${esc(x[0])}</button>`).join('');
    show('ja', s.b && s.b.length, 'flex');
  }
  $('jn').className = note == '⏳' ? 'n' : 'n e';
  $('jn').textContent = note;
}

function draw() {
  const s = state();
  if (s.s == 'job') return job(s);
  mode = 'pick';
  app.innerHTML = pick(s) + (note ? `<div class="n${note == '⏳' ? '' : ' e'}" style="margin-top:6px">${esc(note)}</div>` : '');
}

W.onEvent('chatDataChanged', () => { note = ''; draw() });
draw();
W.ready();
</script>
