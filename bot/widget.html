<!--
  Виджет выбора формата (Bot API 10.4), вариант «Чипы». Только выбор: ход скачивания бот шлёт отдельным виджетом.
  HTML отправленного виджета изменить нельзя, поэтому он — тонкий рендерер состояния из chat_data (см. bot/widget.py):
    {"s":"pick","c":[кодеки],"r":[[качество,[ячейки по кодекам]],...],"a":[[звук,МБ],...],"y":1}
  ячейка: число — МБ видео без звука (0 — размер неизвестен), [МБ, 1] — звук внутри, null — формата нет.
  Другое состояние ({"s":"job","t":"СЕССИЯ ИСТЕКЛА…"}) — только текст, без кнопок.
  Каждый тип элемента выглядит по-своему, как в интерфейсе Cyberpunk 2077:
    быстрый выбор — вкладки с сегментом подчёркивания; ячейки матрицы и звука — чипы: тонкий контур, значение,
    шкала размера внизу, жёлтый ярлык с динамиком (звук внутри), пустой слот пунктиром, выбранный — красная заливка и уголки курсора;
    «Вырезать рекламу» — строка с переключателем; «Скачать» — жёлтая главная кнопка; ✕ — квадратная иконка.
  Лимит: 4096 байт после zlib -9. Комментарии и отступы бот вырезает перед отправкой (_load_html).
-->
<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;background:#0e0e17;color:#f75049;font:600 13px/1 system-ui;letter-spacing:.05em;--r:#f75049;--h:#f75049b2;--l:#f7504961;--c:#5ef6ff;--w:#ece9e6;--y:#f0b537;--g:#1ded83;--a:#fcee0a}
/* красное свечение шапки — отдельным слоем перед #app: в hit-test он ниже строк и тапы не забирает */
#gw{position:absolute;left:0;top:0;width:100%;height:140px;background:linear-gradient(#f7504933,#f7504900)}
/* строки экрана и всё, что нажимается, — position:relative: глитч сдвигает строки через left, а ячейки внутри числятся за своей строкой */
#app,#app>*,.tb,.ch,.tr,.dl,.x{position:relative}
/* рамки — inline-SVG поверх всего блока */
svg{position:absolute;left:0;top:0;width:100%;height:100%;fill:none;stroke:var(--l)}
/* микротекст: служебные коды и мелкая печать */
.u{font:600 8px/1.25 system-ui;color:var(--l);white-space:nowrap}
/* шапка: заголовок и справа столбик служебных кодов, как в «Всех форматах» */
#h{display:flex;align-items:center;padding-bottom:6px;border-bottom:1px solid var(--l)}
#tt{font:500 25px/1.1 system-ui}
#h .u{margin-left:auto;text-align:right}
/* быстрый выбор — вкладки: код ячейки над подписью, сегмент подчёркивания; активная — циан.
   Подпись — ярко-красная, код — 70 %: вкладки — управление, а не заголовки столбцов (те мельче и тусклее) */
#tb{display:flex;gap:3px;margin:6px 0}
.tb{flex:1;min-width:0;padding:3px 0 6px;text-align:center;white-space:nowrap;border-bottom:2px solid var(--l)}
.tb .u{display:block;margin-bottom:4px;color:var(--h)}
.tb.on{color:var(--c);border-color:var(--c);background:linear-gradient(#5ef6ff00,#5ef6ff24)}
.tb.on .u{color:var(--c)}
/* матрица: строки — качество, столбцы — кодеки, последняя строка — звук */
.mr{display:grid;gap:4px;margin-bottom:3px;align-items:center}
.mh{color:#f7504980;font-size:11px;text-align:center}
/* подпись строки: слева риска качества в цветах «Всех форматов» (4K, 2K, 1080, 720, SD) */
.nm{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--w);font-size:12px;border-left:3px solid transparent;padding-left:6px}
.sr{margin-top:6px}
/* чип: тонкий контур, значение по центру, внизу шкала размера (корень доли от самого большого файла) */
.ch{height:30px;min-width:0;display:flex;align-items:center;justify-content:center;border:1px solid #f7504940;background:#f750490f}
.ch b{white-space:nowrap;padding-bottom:2px;color:var(--c);font-weight:600}
.t{position:absolute;left:3px;bottom:3px;width:calc(100% - 6px);height:2px;background:#f7504929}
.t i{display:block;height:2px;background:#5ef6ffb2}
/* пустой слот — пунктир; звук, когда выбрано видео со звуком внутри, — такие же пустые слоты с тусклой подписью */
.no{border:1px dashed #f7504938;background:none}
.no b{color:var(--l)}
/* звук внутри — жёлтый ярлык, как бейджи предметов */
/* ярлык «звук внутри» — динамик тёмным на жёлтом; SVG растянут общим правилом svg, поля — в viewBox */
.tg{position:absolute;top:2px;right:2px;width:14px;height:12px;background:var(--y)}
.tg svg{fill:#0e0e17;stroke:#0e0e17}
/* выбранный чип — заливка, яркий контур и уголки курсора выбора (тапы уголки не забирают) */
.ch.on{background:#f750495c;border-color:var(--r)}
.on b{color:var(--w)}
.on .t i{background:var(--w)}
.k{position:absolute;width:6px;height:6px;border:0 solid var(--w);pointer-events:none}
.kl{left:-3px;border-left-width:2px}
.kr{right:-3px;border-right-width:2px}
.kt{top:-3px;border-top-width:2px}
.kb{bottom:-3px;border-bottom-width:2px}
.sm{margin:7px 0 5px;color:var(--w);line-height:1.35}
/* «Вырезать рекламу» — строка без рамки с настоящим переключателем: угловатая дорожка и ползунок */
.sw{display:flex;align-items:center;gap:8px;padding:6px 0;border:solid #f7504933;border-width:1px 0}
.sl{flex:1;color:var(--w)}
.sl .u{display:block;margin-top:4px}
/* дорожка — CSS-рамка, а не SVG: контур по половинкам пикселя на масштабе Desktop 125 % двоился;
   ползунок — flex по центру (абсолютные отступы сажали его на пиксель ниже середины) */
.tr{width:44px;height:20px;display:flex;align-items:center;padding:0 3px;border:1px solid var(--l)}
.tr i{width:16px;height:12px;background:var(--l)}
.sw.on .tr{justify-content:flex-end;border-color:var(--g);background:#1ded8329}
.sw.on .tr i{background:var(--g)}
.sw.on>.u{color:var(--g)}
/* «Скачать» и ✕ — пара, как «Смотрите на» и «Трейлер» на cyberpunk.net (13.11): рамка #fcee0a 2 px — залитое
   кольцо (обводка двоилась на масштабе 125 %). У «Скачать» срезан внешний левый верхний угол, у ✕ — внешний
   правый нижний; обращённые друг к другу стороны прямые, у «Скачать» посередине глубокий узкий паз (14×2 px).
   Без выбора «Скачать» тёмная с жёлтой подписью, с выбором — сплошная, подпись чёрная; внизу слева — код запроса.
   При нажатии — глитч (.gg): заливка рвётся на полосы. Пара не шире 420 px, справа */
#ac{display:flex;gap:8px;margin:8px 0 0 auto;max-width:420px}
.dl{flex:1;z-index:0;height:40px;display:flex;align-items:center;justify-content:center;padding-bottom:3px}
.fr,.gs{z-index:-1;fill:var(--a);stroke:none}
.fr .k{fill:#0e0e1799}
.on .fr .k{fill:var(--a)}
.gs,.gg .fr{display:none}
.gg .gs{display:block}
.dl b{position:relative;color:var(--a);font:700 16px/1 system-ui;letter-spacing:.06em}
.dl.on b,.gg b{color:#0e0e17}
/* ✕ — вторая кнопка пары: красная рамка без паза (цвет интерфейса), тусклая, пока сбрасывать нечего; крест — в центре масс кнопки
   (срез правого нижнего угла сдвигает его на полпикселя влево и вверх) */
.x{width:44px;height:40px}
.x svg{fill:#f7504959;stroke:none}
.x.on svg{fill:var(--r)}
.x .c{fill:none;stroke:#f7504973;stroke-width:2}
.x.on .c{stroke:var(--r)}
/* ответ бота — строка предупреждения под кнопками с жёлтым ярлыком «!» */
.m{margin-top:8px;color:var(--y);font-size:12px;line-height:1.35}
.m b{padding:0 5px;margin-right:6px;background:var(--y);color:#0e0e17}
/* кадр глитча: строка перекрашивается в циан с жёлтым (как переход вкладок в /panel) */
.gz{color:#5ef6ff;--r:#5ef6ff;--l:#5ef6ff;--h:#5ef6ff;--c:#f0b537;--w:#f0b537}
</style>
<div id="gw"></div>
<div id="app"></div>
<script>
const W = window.TelegramWidget, app = document.getElementById('app');
// Выбор: sv — ячейка видео «строка.столбец», sa — номер звука (-1 — без звука), sb — вырезать рекламу;
// md — что нарисовано, mx — самый большой файл на экране (масштаб шкал)
let sv = '', sa = -1, sb = 0, note = '', busy = 0, Wd = 336, md, mx;
try { sb = +localStorage.sb || 0 } catch (e) {}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';'), N = s => esc(s).toUpperCase();
// Данные — разбором JS, а не JSON.parse: в Telegram Desktop JSON.parse читает числа с русской запятой,
// [7,1] становится [7.1, 1], а 1.4 — 1. Бот присылает чистый JSON, он же — литерал JS
const J = s => { try { return eval('(' + s + ')') || {} } catch (e) { return {} } }, S = () => J(W.chatData);

// Запрос к боту — строго синхронно в обработчике тапа (правило песочницы), не больше одного сразу.
// Пока он идёт, «Скачать» пишет «ЗАПРОС…»; ответ с ошибкой — строкой под кнопками
function ask(d) {
  if (busy) return;
  let p;
  try { p = W.request(d) } catch (e) { note = e.message; return draw() }
  busy = 1; note = ''; draw();
  p.then(a => { note = J(a.result).e || '' },
    e => { note = e.code == 'RATE_LIMITED' ? 'СЕКУНДУ…' : e.code })
    .finally(() => { busy = 0; draw() });
}

// Ячейка матрицы: размер в МБ (0 — неизвестен), [МБ, 1] — звук уже внутри, null — формата нет
const cell = (s, k) => { const [r, c] = k.split('.'); return k ? s.r[r]?.[1][c] : null };
const MB = x => !x ? '?' : x >= 1024 ? (x / 1024).toFixed(1) + 'G' : (x < 10 ? +x.toFixed(1) : Math.round(x)) + 'M';
// запрос «Скачать»: g:<строка.столбец>:<звук>:<sb>; ничего не выбрано — запроса нет
const RQ = () => (sv || sa >= 0) && `g:${sv}:${sa < 0 ? '' : sa}:${sb}`;
// внутренний контур рамки «Скачать» (на 2 px внутрь, против часовой); полосы глитча
const IN = w => `M10.8 2L2 10.8V38H${w - 2}V23H${w - 16}V17H${w - 2}V2Z`,
  GS = w => `<svg class="gs" viewBox="0 0 ${w} 40" preserveAspectRatio="none"><path d="M-6 0h${w}v10H-6zM4 20h${w}v10H4z"/>`
    + `<path fill="#5ef6ff" d="M8 10h${w}v10H8zM-9 30h${w}v10H-9z"/></svg>`;

// Тап по видео: повторный снимает выбор (f — быстрый выбор, всегда выбирает).
// Видео со звуком внутри снимает звук, к видео без звука подставляется первый звук.
function setV(k, f) {
  const s = S();
  sv = sv == k && !f ? '' : k;
  if (cell(s, sv)?.[1]) sa = -1; else if (sv && sa < 0 && s.a.length) sa = 0;
  draw();
}

// чип: k — тап, t — подпись (у видео — размер), z — размер в МБ, x — ярлык в углу; у выбранного — уголки курсора.
// Шкала — корень доли от самого большого файла на экране (общая для видео и звука), чтобы и мелкие были видны
const CH = (k, t, z, on, x) => `<div class="ch${on ? ' on' : ''}" data-k="${k}"><b>${t || MB(z)}</b><i class="t"><i style="width:${Math.sqrt(z / mx) * 100 | 0}%"></i></i>${x}`
  + (on ? '<i class="k kl kt"></i><i class="k kr kt"></i><i class="k kl kb"></i><i class="k kr kb"></i>' : '') + '</div>';
// строка матрицы: подпись (66 px) и n ячеек
const G = (n, x, c) => `<div class="mr${c}" style="grid-template-columns:66px${' 1fr'.repeat(n)}">${x}</div>`;
// цвет риски качества — как полоса редкости в «Всех форматах»: 4K, 2K, 1080, 720, остальное
// (у подписи без числа риски нет: undefined — недопустимый цвет, остаётся прозрачный)
const QC = q => ['var(--y)', '#9d2bf5', '#2f7fff', 'var(--g)', '#6c6876'][[2160, 1440, 1080, 720, 0].findIndex(t => parseInt(q) >= t)];
// шапка: заголовок и столбик служебных кодов справа
const HD = a => `<div id="h"><span id="tt">ФОРМАТ</span><i class="u">${a}</i></div>`;

function pick(s) {
  const R = s.r, Z = s.a, C = s.c, n = R.length, nc = C.length;
  // выбор, которого в новом состоянии нет, снимается; у видео со звуком внутри звука нет
  const v = cell(s, sv), m = v?.[1];
  if (v == null) sv = '';
  if (m || !Z[sa]) sa = -1;
  // mx — самый большой файл (масштаб всех шкал), nf — сколько форматов на экране
  let nf = Z.length;
  mx = Math.max(0, ...Z.map(x => x[1]));
  R.forEach(x => x[1].forEach(v => v != null && (nf++, mx = Math.max(mx, v[0] ?? v))));
  // быстрые кнопки выбирают ячейку: первый столбец с форматом (кодеки идут от самого совместимого)
  const Q = [[0, 'ЛУЧШЕЕ'], n > 2 && [n >> 1, 'СРЕДНЕЕ'], [n - 1, 'МИНИМУМ']].filter(x => x && n > 1);
  let h = HD(`FMT ${nf}<br>MAX ${MB(mx)}`);
  if (Q.length) h += '<div id="tb">' + Q.map(([r, t]) => {
    const c = R[r][1].findIndex(x => x != null), k = r + '.' + c;
    return `<div class="tb${k == sv ? ' on' : ''}" data-k="q${k}"><i class="u">${N(R[r][0] + ' ' + C[c])}</i>${t}</div>`;
  }).join('') + '</div>';
  if (n) h += G(nc, `<i class="u">ВИДЕО · ${n}×${nc}</i>` + C.map(c => `<span>${N(c)}</span>`).join(''), ' mh')
    + R.map((x, r) => G(nc, `<span class="nm" style="border-color:${QC(x[0])}">${N(x[0])}</span>` + x[1].map((v, c) => v == null ? '<i class="ch no"></i>'
      : CH('v' + r + '.' + c, 0, v[0] ?? v, sv == r + '.' + c, v[1] ? '<i class="tg"><svg viewBox="-2 -2 14 12"><path d="M0 2.5H2L5 0V8L2 5.5H0Z"/><path d="M6.5 2.5L7.5 4L6.5 5.5M8 1L9.5 4L8 7" fill="none"/></svg></i>' : '')).join(''), '')).join('');
  // звук; при видео со звуком внутри — пустые слоты без тапа (итог и так пишет «со звуком»)
  if (Z.length) h += G(Z.length, '<span class="nm">ЗВУК</span>'
    + Z.map((x, i) => m ? `<div class="ch no"><b>${N(x[0])}</b></div>` : CH('a' + i, N(x[0]), x[1], sa == i, '')).join(''), ' sr');
  // итог: что выбрано и сколько весит (если размеры известны)
  const a = Z[sa], [r, c] = sv.split('.');
  const t = [sv && R[r][0] + ' ' + C[c] + (m ? ' со звуком' : a ? '' : ' без звука'), a && a[0]].filter(Boolean).join(' + ');
  const vm = sv ? +(m ? v[0] : v) : 0, am = a ? a[1] : 0, z = (!sv || vm) && (!a || am) ? MB(vm + am) : '';
  // ширина рамки «Скачать» (вёрстку она не задаёт: на широком Desktop #ac не шире 420 px и прижат вправо)
  const w = Math.min(Wd, 420) - 52;
  h += `<div class="sm">${t ? N(t) + (z ? ' ≈ ' + z : '') : 'ВЫБЕРИ ФОРМАТ'}</div>`;
  if (s.y) h += `<div class="sw${sb ? ' on' : ''}" data-k="s"><div class="sl">ВЫРЕЗАТЬ РЕКЛАМУ<i class="u">SPONSORBLOCK · СЕГМЕНТЫ</i></div>`
    + `<i class="u">${sb ? 'ВКЛ' : 'ВЫКЛ'}</i><div class="tr"><i></i></div></div>`;
  return h + `<div id="ac"><div class="dl${t && !busy ? ' on' : ''}" data-k="g" id="dl">`
    // рамка — inline-SVG в точных пикселях (clip-path в песочнице запрещён): кольцо = внешний контур по часовой и внутренний против (дырка при любом правиле заливки) + тёмная середина;
    // срезан левый верхний угол, справа паз; только прямые отрезки — разборщик SVG в Telegram самодельный
    + `<svg class="fr" viewBox="0 0 ${w} 40" preserveAspectRatio="none"><path d="M10 0H${w}V19H${w - 14}V21H${w}V40H0V10Z${IN(w)}"/><path class="k" d="${IN(w)}"/></svg>${GS(w)}`
    + `<b>${busy ? 'ЗАПРОС…' : 'СКАЧАТЬ' + (t && z ? ' · ' + z : '')}</b></div>`
    + `<div class="x${t ? ' on' : ''}" data-k="c"><svg viewBox="0 0 44 40"><path d="M0 0H44V32L36 40H0ZM2 2V38H35.2L42 31.2V2Z"/>`
    + '<path class="c" d="M16.5 14.5L26.5 24.5M26.5 14.5L16.5 24.5"/></svg></div></div>' + (note ? `<div class="m"><b>!</b>${N(note)}</div>` : '');
}

// Глитч, как переход вкладок в /panel: пять кадров по 40 мс, в каждом строка может пропасть,
// сдвинуться и перекраситься. Копий нет — только visibility, left и цвет.
// Не transform: строку, которой скрипт три кадра подряд меняет transform, Telegram Desktop делает слоем,
// а тап внутри такого слоя не находит ячейку (position:relative) и достаётся самой строке без data-k
function GZ() {
  let n = 5, r = Math.random;
  const f = () => {
    for (let d = app.firstChild; d; d = d.nextSibling) {
      d.style.visibility = n && r() * 6 < n ? 'hidden' : '';
      d.style.left = n && r() < .5 ? (r() * 40 - 20 | 0) + 'px' : '';
      d.classList.toggle('gz', !!n && r() < .5);
    }
    n-- || clearInterval(t);
  }, t = setInterval(f, 40);
  f();
}

// «Скачать» — глитч при нажатии, как у кнопок на cyberpunk.net: шесть кадров по 40 мс через кадр показывают
// заливку, порванную на сдвинутые жёлтые и циановые полосы (.gg), а кнопка дёргается вбок.
// Сдвиг — left, не transform: Telegram Desktop сделал бы кнопку слоем, и тапы шли бы мимо
function GB() {
  let n = 6;
  const f = () => { const e = $('dl'); e && (e.classList.toggle('gg', n % 2 > 0), e.style.left = n ? (Math.random() * 12 - 6 | 0) + 'px' : ''); n-- || clearInterval(i) }, i = setInterval(f, 40);
  f();
}

function draw() {
  Wd = app.offsetWidth || Wd;
  const s = S(), g = md != s.s;
  md = s.s;
  // не выбор (сессия истекла) — только текст бота, без кнопок
  app.innerHTML = s.s == 'pick' ? pick(s) : HD('') + `<div class="sm">${N(s.t)}</div>`;
  // появление с глитчем — при первом показе и при смене вида
  if (g) GZ();
}

// Тапы — один обработчик на документ, как в /panel: атрибуты onclick Telegram Desktop не вызывает.
// data-k: буква — действие, дальше — аргумент
const F = {
  v: setV, q: k => setV(k, 1),
  // у видео со звуком внутри отдельный звук не выбирается — итог и так пишет «со звуком»
  a: i => { cell(S(), sv)?.[1] || (sa = sa == i ? -1 : +i); draw() },
  s: () => { sb = 1 - sb; try { localStorage.sb = sb } catch (e) {} draw() },
